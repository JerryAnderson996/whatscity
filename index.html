<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WhatsCity — La città che ascolta. E risponde.</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#10b981" />

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Leaflet CSS per Mappa Interattiva e Sensori IoT A2A -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Stili Custom per animazioni e scrollbar -->
    <style>
      body {
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #0f172a;
        margin: 0;
        padding: 0;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.25); opacity: 0.25; }
      }
      .animate-fadeIn {
        animation: fadeIn 0.2s ease-out forwards;
      }
      .animate-slideUp {
        animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .leaflet-container {
        font-family: "Plus Jakarta Sans", sans-serif !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React 18 & ReactDOM UMD -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Babel Standalone per compilazione JSX istantanea nel browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Moduli Applicazione WhatsCity -->
    <script type="text/babel" src="./src/data.js"></script>
    <script type="text/babel" src="./src/AuthModal.js"></script>
    <script type="text/babel" src="./src/AICopilot.js"></script>
    <script type="text/babel" src="./src/MapView.js"></script>
    <script type="text/babel" src="./src/CreateReportModal.js"></script>
    <script type="text/babel" src="./src/Views.js"></script>
    <script type="text/babel" src="./src/App.js"></script>
  </body>
</html>
